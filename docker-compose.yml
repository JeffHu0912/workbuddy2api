# ✅ 本机运行 workbuddy2api（2026-09-12 曾迁 VPS，同日回迁本机）
#
# 现网：本机 Docker 容器 workbuddy2api，监听 0.0.0.0:7863
#   → DSH(settings.yaml) 与 OmniRoute(provider_nodes.wb) 均指向 localhost/host.docker.internal:7863
#
# VPS 上仍保留一份（/opt/wb2api/），**当前处于停止状态**，作为回滚点。
#   ⚠️ 切换前必须先停掉另一侧，再同步 auths/，否则两实例会并发刷新 refresh_token 导致账号失效。
#   切换步骤见 ~/project/_wb2api-backup-rollback-*/MIGRATION-NOTES.md
#
# 查看 VPS 侧状态：
#   ssh -i ~/.ssh/id_ed25519_dsh -p 36327 root@103.236.91.136 \
#       'cd /opt/wb2api && docker compose ps'
# ------------------------------------------------------------------------------
services:
  wb2api:
    build: .
    # 固定镜像名：与手工 `docker run` 时代保持一致，避免出现 project-* / *-wb2api 两份镜像。
    image: project-workbuddy2api
    container_name: workbuddy2api
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
    ports:
      - "7863:7863"
    volumes:
      # auths 凭证卷：login.sh 在宿主机落盘 workbuddy-<uid>.json（0600），容器网关以
      # app(uid 10001) 读 + 回写（refresh / realm backfill 走 tmp+rename，需目录写权限）。
      # 跨 uid 部署（非 root 宿主落盘 / rootful 下宿主 uid≠10001）读不到 → 账号数为 0
      # （issue #108）。登录后把目录属主交给 10001（与 ./data 卷同口径）：
      #   chown -R 10001:10001 ./auths
      # 之后新增账号建议进容器登录（app 自身落盘，属主即 10001，免反复 chown；容器内无
      # docker CLI，完成后回宿主机重启）：
      #   docker compose exec -it wb2api bash -c './login.sh' && docker compose restart wb2api
      - ./auths:/app/auths
      # data 保持 bind mount（本地映射，与旧版本一致）。
      # 若容器内 app(uid 10001) 写 state.json 报 permission denied，宿主机执行：
      #   chown -R 10001:10001 ./data
      - ./data:/app/data
      - ./config.json:/app/config.json:ro
    # 声明外部网络：与既有容器拓扑一致（trae2api 亦在此网络）。
    # 若改为 compose 默认网络，会导致容器重建后网络归属漂移。
    networks:
      - ai-mesh

  # ─── QQ 号池（第二实例）────────────────────────────────────────────
  # 与手机号池物理隔离：独立 auths-qq/ + data-qq/ + config-qq.json + 端口 7865。
  # 同一镜像 project-workbuddy2api，仅挂载卷与配置不同；ENTRYPOINT 固定读
  # /app/config.json，故把 config-qq.json 挂载覆盖到该路径。
  wb2api-qq:
    image: project-workbuddy2api
    container_name: workbuddy2api-qq
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
    ports:
      - "7865:7865"
    volumes:
      - ./auths-qq:/app/auths
      - ./data-qq:/app/data
      - ./config-qq.json:/app/config.json:ro
    networks:
      - ai-mesh

networks:
  ai-mesh:
    external: true
